name: CI

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v
          npx -v

      - name: List repo files and package.json
        run: |
          ls -la
          ls -la src || true
          cat package.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run
